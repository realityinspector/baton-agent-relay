<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="440" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#e6edf3">Baton — an HTTP pipe between two AI agents</text>
  <text x="40" y="72" font-size="14" fill="#9da7b3">Different processes, networks, vendors, or trust assumptions. No accounts. Plain HTTP.</text>

  <!-- Agent A -->
  <rect x="40" y="150" width="190" height="120" rx="12" fill="#161c2e" stroke="#6366f1" stroke-width="2"/>
  <text x="135" y="195" font-size="17" font-weight="700" fill="#a5b4fc" text-anchor="middle">Agent A</text>
  <text x="135" y="220" font-size="12.5" fill="#818cf8" text-anchor="middle">planner / doc-keeper</text>
  <text x="135" y="245" font-size="12.5" fill="#818cf8" text-anchor="middle">curl or python client</text>

  <!-- Relay -->
  <rect x="365" y="135" width="190" height="150" rx="12" fill="#161b22" stroke="#e6edf3" stroke-width="2"/>
  <text x="460" y="172" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Baton relay</text>
  <text x="460" y="196" font-size="12.5" fill="#9da7b3" text-anchor="middle">Express / TypeScript</text>
  <text x="460" y="216" font-size="12.5" fill="#9da7b3" text-anchor="middle">rooms · messages</text>
  <text x="460" y="236" font-size="12.5" fill="#9da7b3" text-anchor="middle">tokens · claims · x402</text>
  <text x="460" y="262" font-size="11.5" fill="#8b949e" text-anchor="middle">readable in one sitting</text>

  <!-- Store -->
  <g>
    <ellipse cx="460" cy="335" rx="70" ry="13" fill="#0f241c" stroke="#10b981" stroke-width="2"/>
    <path d="M390 335 V370 a70 13 0 0 0 140 0 V335" fill="#0f241c" stroke="#10b981" stroke-width="2"/>
    <text x="460" y="362" font-size="12.5" font-weight="600" fill="#34d399" text-anchor="middle">Redis or memory</text>
  </g>
  <line x1="460" y1="285" x2="460" y2="322" stroke="#10b981" stroke-width="2"/>

  <!-- Agent B -->
  <rect x="690" y="150" width="190" height="120" rx="12" fill="#161c2e" stroke="#6366f1" stroke-width="2"/>
  <text x="785" y="195" font-size="17" font-weight="700" fill="#a5b4fc" text-anchor="middle">Agent B</text>
  <text x="785" y="220" font-size="12.5" fill="#818cf8" text-anchor="middle">executor / builder</text>
  <text x="785" y="245" font-size="12.5" fill="#818cf8" text-anchor="middle">any vendor, anywhere</text>

  <!-- A <-> Relay arrows -->
  <line x1="230" y1="188" x2="357" y2="188" stroke="#6366f1" stroke-width="2"/>
  <polygon points="357,188 345,182 345,194" fill="#6366f1"/>
  <text x="293" y="180" font-size="11.5" fill="#818cf8" text-anchor="middle">POST  (send)</text>

  <line x1="357" y1="232" x2="230" y2="232" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="230,232 242,226 242,238" fill="#0ea5e9"/>
  <text x="293" y="250" font-size="11.5" fill="#38bdf8" text-anchor="middle">SSE / long-poll  (read)</text>

  <!-- B <-> Relay arrows -->
  <line x1="690" y1="188" x2="563" y2="188" stroke="#6366f1" stroke-width="2"/>
  <polygon points="563,188 575,182 575,194" fill="#6366f1"/>
  <text x="627" y="180" font-size="11.5" fill="#818cf8" text-anchor="middle">POST  (send)</text>

  <line x1="563" y1="232" x2="690" y2="232" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="690,232 678,226 678,238" fill="#0ea5e9"/>
  <text x="627" y="250" font-size="11.5" fill="#38bdf8" text-anchor="middle">SSE / long-poll  (read)</text>

  <!-- footer -->
  <text x="40" y="418" font-size="12.5" fill="#9da7b3">Both agents see one ordered, optionally signed &amp; hash-chained transcript. The relay only moves bytes — public, bearer-gated, or E2E-encrypted.</text>
</svg>
